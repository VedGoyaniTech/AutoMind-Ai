services:
  mysql:
    image: mysql:8.0
    container_name: automind_mysql_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: automind_db
      MYSQL_USER: automind_user
      MYSQL_PASSWORD: automind_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: automind_backend_dev
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./backend/tests:/app/tests
      - ./backend/data:/app/data
      - ./backend/alembic:/app/alembic
      - ./ml:/app/ml
    environment:
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: mysql+pymysql://automind_user:automind_pass@mysql:3306/automind_db
      LLM_PROVIDER: grounded
      EMBEDDING_MODEL_ID: all-MiniLM-L6-v2
      VECTOR_STORE_TYPE: local
      VECTOR_INDEX_PATH: ./vector_index
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend.dev
    container_name: automind_frontend_dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_dev_data:
